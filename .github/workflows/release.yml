name: Build plasmoid release

# Builds com.calenderclock.plasmoid from source and attaches it to a
# GitHub Release. Trigger: push a tag like v1.0 / v1.1
#   git tag v1.0 && git push origin v1.0
# The tag must match KPlugin.Version in metadata.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check tag matches version
        run: |
          version="v$(jq -r .KPlugin.Version com.calenderclock/metadata.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match metadata.json version $version"
            exit 1
          fi

      - name: Build .plasmoid
        run: |
          cd com.calenderclock
          zip -qr ../com.calenderclock.plasmoid metadata.json contents
          unzip -l ../com.calenderclock.plasmoid

      - name: Publish to release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" com.calenderclock.plasmoid --clobber
          else
            gh release create "$GITHUB_REF_NAME" com.calenderclock.plasmoid --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
